name: Build Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Сборка плагина через Maven
        run: mvn -B package --file pom.xml

      - name: Выгрузка готового JAR
        uses: actions/upload-artifact@v4
        with:
          name: PryatkiPlugin
          path: target/PryatkiPlugin-1.0-SNAPSHOT.jar
